# cargo-deny: licences, security advisories, duplicate crates and sources.
# https://embarkstudios.github.io/cargo-deny/

[graph]
# PocketSpot ships for aarch64 Linux; macOS is checked for development.
targets = ["aarch64-unknown-linux-gnu", "aarch64-apple-darwin"]
all-features = true

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
# Permissive licences, plus MPL-2.0 (file-level copyleft: source offered
# with each release).
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
